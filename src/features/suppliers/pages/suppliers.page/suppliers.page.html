<section class="suppliers-page">
	<div class="suppliers-page__header">
		<app-page-title titleKey="suppliersPage.title" />
		<button mat-flat-button color="primary" (click)="addSupplier()">
			<mat-icon>add</mat-icon>
			{{ 'suppliersPage.addSupplier' | translate }}
		</button>
	</div>

	@if (loading()) {
		<div class="suppliers-page__loader">
			<mat-spinner diameter="50" />
		</div>
	} @else if (suppliers().length === 0) {
		<div class="suppliers-page__empty">
			<mat-icon class="suppliers-page__empty-icon">search_off</mat-icon>
			<p>{{ 'suppliersPage.empty' | translate }}</p>
		</div>
	} @else {
		@for (supplier of suppliers(); track supplier.id) {
			{{ supplier | json }}
		}
	}
</section>
