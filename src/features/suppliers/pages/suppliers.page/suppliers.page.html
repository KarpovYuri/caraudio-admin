<section class="suppliers-page gap-6">
	<app-page-header
		titleKey="suppliersPage.title"
		actionLabelKey="suppliersPage.addSupplier"
		(actionClick)="addSupplier()"
	/>

	<app-list-filters
		[search]="searchInput()"
		(searchChange)="onSearchInput($event)"
		[filter]="statusFilter()"
		(filterChange)="onStatusFilterChange($event)"
		searchLabelKey="suppliersPage.search"
		filterLabelKey="suppliersPage.statusFilter.label"
		filterOptionKeyPrefix="suppliersPage.statusFilter."
		[filterOptions]="statusFilterOptions"
	/>

	@if (loading()) {
		<app-page-loader />
	} @else if (total() === 0) {
		<app-empty-state messageKey="suppliersPage.empty" />
	} @else {
		<app-suppliers-list
			[suppliers]="suppliers()"
			(edit)="editSupplier($event)"
			(remove)="deleteSupplier($event)"
			(copyApiUrl)="copyApiUrl($event)"
		/>

		@if (hasMultiplePages()) {
			<mat-paginator
				class="suppliers-page__paginator"
				[length]="total()"
				[pageIndex]="pageIndex()"
				[pageSize]="pageSize"
				[hidePageSize]="true"
				[showFirstLastButtons]="true"
				(page)="onPageChange($event)"
			/>
		}
	}
</section>
