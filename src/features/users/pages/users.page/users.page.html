<section class="users-page gap-6">
	<app-page-header
		titleKey="usersPage.title"
		actionLabelKey="usersPage.addUser"
		(actionClick)="addUser()"
	/>

	<app-list-filters
		[search]="searchInput()"
		(searchChange)="onSearchInput($event)"
		[filter]="roleFilter()"
		(filterChange)="onRoleFilterChange($event)"
		searchLabelKey="usersPage.search"
		filterLabelKey="usersPage.roleFilter.label"
		filterOptionKeyPrefix="usersPage.roleFilter."
		[filterOptions]="roleFilterOptions"
	/>

	@if (loading()) {
		<app-page-loader />
	} @else if (total() === 0) {
		<app-empty-state messageKey="usersPage.empty" />
	} @else {
		<app-users-list
			[users]="users()"
			(edit)="editUser($event)"
			(remove)="deleteUser($event)"
		/>

		@if (hasMultiplePages()) {
			<mat-paginator
				[length]="total()"
				[pageIndex]="pageIndex()"
				[pageSize]="pageSize"
				[hidePageSize]="true"
				[showFirstLastButtons]="true"
				(page)="onPageChange($event)"
			/>
		}
	}
</section>
